<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect x="0" y="0" width="400" height="400" fill="#1a1a2e" rx="20" ry="20"/>
  
  <!-- グラデーション定義 -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4d61eb" />
      <stop offset="100%" stop-color="#16213e" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fc5185" />
      <stop offset="100%" stop-color="#f07b3f" />
    </linearGradient>
  </defs>
  
  <!-- モダンな矢印シンボル -->
  <path d="M100,200 L270,200 M130,160 C110,170 110,230 150,230 M130,240 C110,230 110,170 150,170" fill="none" stroke="url(#grad2)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="drop-shadow(3px 3px 5px rgba(0,0,0,0.5))"/>
  
  <!-- ミニマルな音波表現 -->
  <path d="M80,300 Q100,270 120,300 T160,300 T200,300 T240,300 T280,300 T320,300" stroke="#4d61eb" stroke-width="3" fill="none" opacity="0.8"/>
  <path d="M100,320 Q120,290 140,320 T180,320 T220,320 T260,320 T300,320" stroke="#fc5185" stroke-width="2" fill="none" opacity="0.7"/>
  
  <!-- シンプルなサークルエレメント -->
  <circle cx="320" cy="100" r="30" fill="url(#grad1)" opacity="0.8"/>
  <circle cx="80" cy="100" r="15" fill="#fc5185" opacity="0.8"/>
  
  <!-- モダンなテキスト配置 -->
  <text x="200" y="100" font-family="Comic Sans MS, Rundkopf, Chalkboard SE, sans-serif" font-size="60" font-weight="700" text-anchor="middle" fill="white" filter="drop-shadow(1px 1px 3px rgba(0,0,0,0.3))">yy-pod</text>
  
  <!-- サブテキスト -->
  
</svg>
